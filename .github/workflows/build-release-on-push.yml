# A workflow to build XSan automatically.
name: Build on Push

on:
  workflow_dispatch:
  # No push trigger. It used to list dev-xsan and 'users/**', neither of which
  # exists on this fork, so a push never built anything here. Pointing it at
  # mair-trunk would work, but it only duplicates the PR gate: every merge into
  # trunk is already built and lit-tested on both LLVM legs by
  # build-test-on-pr.yml, at roughly ten minutes per merge. Dispatch-only, which
  # is also how releases happen here: dispatch the Release workflow directly.

jobs:
  # Add a conditional check task to ensure that the release is only triggered when a bump PR is merged
  # With the push trigger gone there is no head_commit to inspect on a dispatch,
  # so this can no longer report triggered=true and the release leg below is
  # unreachable from this workflow -- dispatch Release directly instead.
  gatekeeper:
    runs-on: ubuntu-22.04
    outputs:
      triggered: ${{ steps.check_commit.outputs.triggered }}
    steps:
      - name: Check Commit Message
        id: check_commit
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Check if the commit message is a bump PR
          if [[ $COMMIT_MSG == "chore: bump to version"* ]]; then
            echo "Bump PR merged. Triggering release."
            echo "triggered=true" >> $GITHUB_OUTPUT
          else
            echo "Not a bump PR. Skipping release."
            echo "triggered=false" >> $GITHUB_OUTPUT
          fi
  build:
    needs: [gatekeeper]
    # The owner check used to be part of this condition. It is false on any
    # fork, which silently disabled the fork's own trunk builds -- the same
    # reason it was dropped from build-test-on-pr.yml. Whether Actions run is a
    # repository setting, not something to hard-code in a workflow.
    if: needs.gatekeeper.outputs.triggered == 'false'
    strategy:
      fail-fast: false
      matrix:
        os_type: [ubuntu-22.04]
        version: [15]
    concurrency:
      group: ${{ github.ref }}-${{ matrix.os_type }}-${{ matrix.version }}
      cancel-in-progress: true
    runs-on: ${{ matrix.os_type }}
    steps:
      - name: Checkout code
        # uses: actions/checkout@v4
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build XSan
        uses: ./.github/workflows/build
        with:
          build_type: Debug
          llvm_version: ${{ matrix.version }}
  release:
    permissions:
      contents: write
    needs: [gatekeeper]
    if: needs.gatekeeper.outputs.triggered == 'true'
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    # Was Camsyn/XSan/.github/workflows/release.yml@dev-xsan. A reusable
    # workflow is addressed by repository, so on this fork that points at a repo
    # it cannot read (404), and the ref dev-xsan does not exist here either --
    # the release leg would have failed on the first real bump commit.
    # release.yml sits in this repo and already declares workflow_call.
    uses: ./.github/workflows/release.yml
